# These hoists are needed for @dhis2/app-shell since it uses directly some libraries that were hoisted by yarn 1
# This is a better alternative than pnpm's shamefullyHoist https://pnpm.io/settings#shamefullyhoist until we update the way that @dhis2/app-shell works
publicHoistPattern:
    - '@dhis2/ui'
    - 'typeface-roboto'
    - '@dhis2/app-adapter'
    - 'prop-types'
    - '@dhis2/d2-i18n'
    - 'post-robot'
    - 'styled-jsx'
    - '@dhis2/app-adapter'
    - '@dhis2/pwa'

onlyBuiltDependencies:
    - '@dhis2/cli-helpers-engine'
    - core-js-pure
    - esbuild

# Security overrides for transitive dependencies, limited to same-major upgrades
# (styled-jsx pins loader-utils 1.2.3; request pins form-data ~2.3 and qs ~6.5)
overrides:
    'loader-utils@<1.4.2': ^1.4.2
    'form-data@>=2 <2.5.4': ^2.5.6
    'qs@>=6 <6.14.1': ^6.16.0
